baseURL = "https://hidev078.github.io/"   # CI では --baseURL で上書きされる
title = "ひでぶログ"
theme = "PaperMod"

# ---- 言語・地域 ----
locale = "ja-JP"
defaultContentLanguage = "ja"
timeZone = "Asia/Tokyo"
hasCJKLanguage = true   # 日本語の文字数・要約・読了時間を正しく扱う
summaryLength = 120

# ---- ビルド ----
buildDrafts = false     # draft = true の記事は公開しない
buildFuture = false     # 未来日時の記事は公開しない
enableRobotsTXT = true
enableEmoji = true
enableGitInfo = false   # true にすると lastmod を Git のコミット日時から取得する

[pagination]
  pagerSize = 10

[languages.ja]
  label = "日本語"
  weight = 1

# 検索ページ（content/search.md）は JSON インデックスを使う
[outputs]
  home = ["HTML", "RSS", "JSON"]

# 日付の決定ルール（:git は enableGitInfo = true のときだけ有効）
[frontmatter]
  date = ["date", "publishDate", "lastmod"]
  lastmod = [":git", "lastmod", "date", "publishDate"]

[markup]
  [markup.goldmark.renderer]
    unsafe = true   # 記事内の生 HTML を出力する（CLAUDE.md のセキュリティ節を参照）
  [markup.highlight]
    noClasses = false
    style = "monokai"

# ---- メニュー ----
[[menu.main]]
  identifier = "home"
  name = "Home"
  url = "/"
  weight = 10

[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 20

[[menu.main]]
  identifier = "tags"
  name = "Tags"
  url = "/tags/"
  weight = 30

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 40

# ---- PaperMod ----
[params]
  env = "production"
  description = "技術メモを書きためるブログ"
  author = "ひでぶ"
  DateFormat = "2006年1月2日"   # Go の日付レイアウト（例: 2026年10月21日）
  defaultTheme = "auto"         # light / dark / auto

  # 記事ページの表示
  ShowReadingTime = true
  ShowWordCount = true
  ShowLastMod = true
  ShowToc = true
  TocOpen = false
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowShareButtons = false

  [params.homeInfoParams]
    Title = "ようこそ 👋"
    Content = "ひでぶログへようこそ。日々の技術的な学びをメモしています。"
